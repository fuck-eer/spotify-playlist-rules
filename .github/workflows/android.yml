name: android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/rules-engine/fixtures/**"
  push:
    branches: [integration]
    paths:
      - "apps/android/**"
      - "packages/rules-engine/fixtures/**"

jobs:
  build:
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # v4 dropped the removed legacy "tools" package from the defaults (v3 failed:
      # "Failed to find package tools"). Packages listed explicitly so it can't come back.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew --console=plain :app:assembleDebug :app:testDebugUnitTest :engine:test
